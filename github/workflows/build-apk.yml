# Android APK yig'ish (GitHub Actions). Repozitoriya ildizida pubspec.yaml bo'lishi kerak.
# android/ papkasi shu yerda `flutter create` bilan hosil qilinadi, repozitoriyada saqlash shart emas.
name: Build Android APK

on:
  workflow_dispatch:   # Actions bo'limidan qo'lda ishga tushiriladi
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android platformasini yaratish
        run: |
          flutter create --platforms=android --project-name hosilx --org uz.hosilx .
          rm -f test/widget_test.dart

      - name: Internet ruxsati va ilova nomi
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="hosilx"#android:label="Hosil X"#' $M

      - run: flutter pub get

      - name: Testlar
        run: flutter test
        continue-on-error: true   # birinchi bosqichda testlar buildni to'xtatmasin; natijani Actions logida ko'ring

      - name: APK yig'ish
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=WEB_URL=${{ secrets.WEB_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: hosilx-apk
          path: build/app/outputs/flutter-apk/app-release.apk
